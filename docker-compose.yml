version: '3.8'

services:
  board-mysql:
    image: mysql:latest
    container_name: board-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - "C:/board_mysql_data:/var/lib/mysql"

  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379"
      - "8001:8001"

  board-app:
    build: .
    container_name: board-app-container
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "docker"
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - "C:/board_upload:/app/upload"
    depends_on:
      - board-mysql
      - redis-stack